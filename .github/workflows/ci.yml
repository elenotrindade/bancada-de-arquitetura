name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build de produção
        run: npm run build

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Teste de fumaça
        run: |
          npm run start -- -p 3000 > server.log 2>&1 &
          node scripts/smoke.mjs

      - name: Log do servidor
        if: always()
        run: tail -n 80 server.log || true

      - name: Guardar screenshots e lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            screenshots/
            package-lock.json
          retention-days: 7

      - name: Publicar screenshots no branch ci-screenshots
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p screenshots && cp package-lock.json screenshots/ 2>/dev/null || true
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots de ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
